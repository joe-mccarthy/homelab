---
# Confirm manager access before pausing any existing replacement scheduler.
- name: Preflight legacy Swarm scheduler cleanup
  ansible.builtin.include_role:
    name: remove_legacy_swarm_services
  vars:
    remove_legacy_swarm_services_check_only: true
    remove_legacy_swarm_services_list:
      - nfs_backup_restic_backup
      - nfs_backup_restic_prune
      - nfs_backup_restic_check

- name: Activate validated backup scheduler
  block:
    - name: Recheck repository locks before scheduler cutover
      ansible.builtin.command:
        cmd: /usr/local/sbin/nfs-backup-job restic list locks
      register: deploy_backup_cutover_repository_locks
      changed_when: false
      environment:
        NFS_BACKUP_MAINTENANCE: "1"

    - name: Refuse scheduler cutover during a repository operation
      ansible.builtin.assert:
        that:
          - >-
            deploy_backup_cutover_repository_locks.stdout |
            regex_findall('(?m)^[0-9a-f]{64}$') | length == 0
        fail_msg: >-
          The Restic repository became locked during deployment; the previous
          timer state will be restored.

    - name: Quiesce legacy scheduled backup Swarm services
      ansible.builtin.include_role:
        name: remove_legacy_swarm_services
      vars:
        remove_legacy_swarm_services_action: quiesce
        remove_legacy_swarm_services_list:
          - nfs_backup_restic_backup
          - nfs_backup_restic_prune
          - nfs_backup_restic_check

    - name: Record legacy scheduler quiescence
      ansible.builtin.set_fact:
        deploy_backup_legacy_scheduler_quiesced: true

    - name: Recheck repository locks after legacy scheduler cleanup
      ansible.builtin.command:
        cmd: /usr/local/sbin/nfs-backup-job restic list locks
      register: deploy_backup_post_cleanup_repository_locks
      changed_when: false
      environment:
        NFS_BACKUP_MAINTENANCE: "1"

    - name: Refuse activation during a repository operation
      ansible.builtin.assert:
        that:
          - >-
            deploy_backup_post_cleanup_repository_locks.stdout |
            regex_findall('(?m)^[0-9a-f]{64}$') | length == 0
        fail_msg: >-
          The repository became locked during legacy scheduler cleanup;
          replacement timers remain disabled.

    - name: Enable scheduled backup timers
      ansible.builtin.systemd:
        name: "nfs-backup-{{ item.item.key }}.timer"
        enabled: true
        state: "{{ item.changed | ternary('restarted', 'started') }}"
      loop: "{{ deploy_backup_timer_units.results }}"
      loop_control:
        label: "{{ item.item.key }}"

    - name: Record replacement scheduler activation
      ansible.builtin.set_fact:
        deploy_backup_scheduler_activated: true

    - name: Retire legacy scheduled backup Swarm services
      ansible.builtin.include_role:
        name: remove_legacy_swarm_services
      vars:
        remove_legacy_swarm_services_action: remove
        remove_legacy_swarm_services_list:
          - nfs_backup_restic_backup
          - nfs_backup_restic_prune
          - nfs_backup_restic_check
