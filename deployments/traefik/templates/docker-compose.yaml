---
# Traefik label keys and Jinja expressions are intentionally kept intact.
# yamllint disable rule:line-length
services:
  traefik:
    container_name: traefik
    image: "traefik:{{ traefik.version }}"
    restart: unless-stopped
    networks:
      - proxy
    secrets:
      - cf_token
      - cf_email
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false

      - --api.insecure=false
      - "--api.dashboard={{ (traefik.dashboard.enabled | bool) | ternary('true', 'false') }}"
      - --api.debug=false

      - --log.level=DEBUG
      - --log.filepath=/logs/traefik.log

      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.ssh.address=:2222
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https

      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - "--providers.docker.network={{ traefik.proxy_network }}"

      - --certificatesresolvers.letsencrypt.acme.dnschallenge=true
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,1.0.0.1:53
      - --certificatesresolvers.letsencrypt.acme.dnschallenge.propagation.delaybeforechecks=20s
      - "--certificatesresolvers.letsencrypt.acme.email=admin@{{ vault.shared.general.domain }}"
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.caserver=https://acme-v02.api.letsencrypt.org/directory

      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certresolver=letsencrypt
      - "--entrypoints.websecure.http.tls.domains[0].main={{ vault.shared.general.domain }}"
      - "--entrypoints.websecure.http.tls.domains[0].sans=*.{{ vault.shared.general.domain }}"
    labels:
      traefik.enable: "{{ (traefik.dashboard.enabled | bool) | ternary('true', 'false') }}"
      traefik.http.routers.traefik.entrypoints: web
      traefik.http.routers.traefik.rule: >-
        Host(`traefik.{{ vault.shared.general.domain }}`)
      traefik.http.middlewares.traefik-dashboard-allowlist.ipallowlist.sourcerange: >-
        {{ traefik.dashboard.allowed_ips }}
      traefik.http.middlewares.traefik-https-redirect.redirectscheme.scheme: https
      traefik.http.routers.traefik.middlewares: >-
        traefik-dashboard-allowlist,traefik-https-redirect
      traefik.http.routers.traefik-secure.entrypoints: websecure
      traefik.http.routers.traefik-secure.rule: >-
        Host(`traefik.{{ vault.shared.general.domain }}`)
      traefik.http.routers.traefik-secure.tls: 'true'
      traefik.http.routers.traefik-secure.tls.certresolver: letsencrypt
      traefik.http.routers.traefik-secure.middlewares: >-
        traefik-dashboard-allowlist
      traefik.http.routers.traefik-secure.service: api@internal
      traefik.docker.network: "{{ traefik.proxy_network }}"
    ports:
      - "{{ traefik.ports.web }}:80"
      - "{{ traefik.ports.websecure }}:443"
      - "{{ traefik.ports.ssh }}:2222"
    environment:
      CF_API_EMAIL_FILE: /run/secrets/cf_email
      CF_DNS_API_TOKEN_FILE: /run/secrets/cf_token
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - "{{ traefik.data_dir }}:/letsencrypt"
      - "{{ traefik.data_dir }}/logs:/logs"

networks:
  proxy:
    external: true
    name: "{{ traefik.proxy_network }}"

secrets:
  cf_token:
    file: ./secrets/cf_token
  cf_email:
    file: ./secrets/cf_email
