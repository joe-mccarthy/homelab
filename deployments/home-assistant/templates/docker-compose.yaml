---
# Traefik label keys and Jinja expressions are intentionally kept intact.
# yamllint disable rule:line-length
services:
  homeassistant:
    container_name: homeassistant
    image: >-
      ghcr.io/home-assistant/home-assistant:{{ home_assistant.versions.homeassistant }}
    restart: unless-stopped
    privileged: true
    networks:
      - default
      - proxy
    volumes:
      - "{{ home_assistant.data_dir }}:/config"
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8123/', timeout=5).close()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.homeassistant.entrypoints: web
      traefik.http.routers.homeassistant.rule: >-
        Host(`homeassistant.{{ vault.shared.general.domain }}`)
      traefik.http.middlewares.homeassistant-https-redirect.redirectscheme.scheme: >-
        https
      traefik.http.routers.homeassistant.middlewares: >-
        homeassistant-https-redirect
      traefik.http.routers.homeassistant-secure.entrypoints: websecure
      traefik.http.routers.homeassistant-secure.rule: >-
        Host(`homeassistant.{{ vault.shared.general.domain }}`)
      traefik.http.routers.homeassistant-secure.tls: 'true'
      traefik.http.routers.homeassistant-secure.service: homeassistant
      traefik.http.routers.homeassistant-secure.tls.certresolver: letsencrypt
      traefik.http.services.homeassistant.loadbalancer.server.port: '8123'
      traefik.http.services.homeassistant.loadbalancer.passhostheader: 'true'
      traefik.docker.network: "{{ home_assistant.proxy_network }}"

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: >-
      ghcr.io/koenkk/zigbee2mqtt:{{ home_assistant.versions.zigbee2mqtt }}
    restart: unless-stopped
    networks:
      - default
      - proxy
    volumes:
      - "{{ home_assistant.data_dir }}/zigbee2mqtt/data:/app/data"
      - /run/udev:/run/udev:ro
{% if home_assistant.zigbee_serial_port is match('^/dev/') %}
    devices:
      - "{{ home_assistant.zigbee_serial_port }}:{{ home_assistant.zigbee_serial_port }}"
{% endif %}
    environment:
      TZ: Europe/London
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:8080/').then(response => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: 'true'
      traefik.http.routers.zigbee2mqtt.entrypoints: web
      traefik.http.routers.zigbee2mqtt.rule: >-
        Host(`zigbee2mqtt.{{ vault.shared.general.domain }}`)
      traefik.http.middlewares.zigbee2mqtt-https-redirect.redirectscheme.scheme: >-
        https
      traefik.http.routers.zigbee2mqtt.middlewares: >-
        zigbee2mqtt-https-redirect
      traefik.http.routers.zigbee2mqtt-secure.entrypoints: websecure
      traefik.http.routers.zigbee2mqtt-secure.rule: >-
        Host(`zigbee2mqtt.{{ vault.shared.general.domain }}`)
      traefik.http.routers.zigbee2mqtt-secure.tls: 'true'
      traefik.http.routers.zigbee2mqtt-secure.service: zigbee2mqtt
      traefik.http.routers.zigbee2mqtt-secure.tls.certresolver: letsencrypt
      traefik.http.services.zigbee2mqtt.loadbalancer.server.port: '8080'
      traefik.http.services.zigbee2mqtt.loadbalancer.passhostheader: 'true'
      traefik.docker.network: "{{ home_assistant.proxy_network }}"

  matter-server:
    container_name: matter-server
    image: >-
      ghcr.io/matter-js/matterjs-server:{{ home_assistant.versions.matter_server }}
    restart: unless-stopped
    read_only: true
    network_mode: host
    volumes:
      - "{{ home_assistant.data_dir }}/matter-server/data:/data"
    environment:
      TZ: Europe/London
    healthcheck:
      disable: false

  mqtt:
    container_name: mqtt
    image: "eclipse-mosquitto:{{ home_assistant.versions.mqtt }}"
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    networks:
      - default
    volumes:
      - "{{ home_assistant.data_dir }}/mosquitto:/mosquitto"
    healthcheck:
      test:
        - CMD
        - mosquitto_pub
        - -h
        - 127.0.0.1
        - -t
        - healthcheck
        - -m
        - ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  default:
    name: home_assistant_compose
  proxy:
    external: true
    name: "{{ home_assistant.proxy_network }}"
