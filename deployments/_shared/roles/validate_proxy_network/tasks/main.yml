---
- name: Inspect external proxy network
  community.docker.docker_network_info:
    name: "{{ validate_proxy_network_name }}"
  register: validate_proxy_network_info

- name: Require a usable external proxy network
  ansible.builtin.assert:
    that:
      - validate_proxy_network_info.exists
      - validate_proxy_network_info.network.Scope == 'local'
      - validate_proxy_network_info.network.Driver == 'bridge'
    fail_msg: >-
      External network {{ validate_proxy_network_name }} must exist as a local
      bridge before deployment.
