---
- name: Validate Immich target
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Require an Immich target
      ansible.builtin.assert:
        that:
          - target is defined
          - target | default('') | string | trim | length > 0
        fail_msg: >-
          Pass an inventory hostname, DNS name, or IP address with
          -e target=<host-or-address>.

    - name: Add Immich target to the temporary deployment group
      ansible.builtin.add_host:
        name: "{{ target | string | trim }}"
        groups: deployment_target

- name: Deploy Immich
  hosts: deployment_target
  become: true
  gather_facts: false
  any_errors_fatal: true

  tasks:
    - name: Run staged Immich deployment
      ansible.builtin.include_role:
        name: immich
