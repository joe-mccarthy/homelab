---
paperless:
  # Single-host paths and Docker network
  data_dir: /exports/docker/paperless
  compose_dir: /opt/paperless
  proxy_network: proxy
  allow_fresh_install: "{{ paperless_allow_fresh_install | default(false) }}"
  sqlite_migration: "{{ paperless_sqlite_migration | default(false) }}"

  # Stable application and database credentials (from Ansible Vault)
  secret_key: "{{ vault.services.paperless.secret_key }}"
  database:
    data_dir: /exports/docker/paperless/database
    major_version: '18'
    name: paperless
    user: paperless
    password: "{{ vault.services.paperless.database_password }}"

  # Container user used by the Paperless image
  uid: '1000'
  gid: '1000'

  # Pinned image tags for reproducible deployments
  versions:
    broker: "8.10.1"
    app: "3.1.0"
    database: "18.6-bookworm"
    gotenberg: "8.36.0"
    tika: "3.3.1.0"

# Notes:
# - The play targets the host passed with -e target=<host-or-address>.
# - data_dir is local to that host; it does not need to be an NFS mount.
# - Keep secret_key stable after the first deployment.
