---
- name: Inspect Docker Swarm state
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - json
  register: remove_legacy_swarm_services_docker_info
  changed_when: false

- name: Require a Swarm manager for legacy service cleanup
  ansible.builtin.assert:
    that:
      - >-
        (remove_legacy_swarm_services_docker_info.stdout |
         from_json).Swarm.LocalNodeState != 'active'
        or (remove_legacy_swarm_services_docker_info.stdout |
            from_json).Swarm.ControlAvailable
    fail_msg: >-
      Legacy Swarm services can only be inspected and changed on a manager.
      Run this migration against a Swarm manager.

- name: Inspect named legacy Swarm services
  ansible.builtin.command:
    argv:
      - docker
      - service
      - inspect
      - "{{ item }}"
  loop: "{{ remove_legacy_swarm_services_list }}"
  loop_control:
    label: "{{ item }}"
  register: remove_legacy_swarm_services_inspections
  changed_when: false
  failed_when: >-
    remove_legacy_swarm_services_inspections.rc != 0
    and 'no such service' not in
        (remove_legacy_swarm_services_inspections.stderr | lower)
  when: >-
    (remove_legacy_swarm_services_docker_info.stdout |
     from_json).Swarm.LocalNodeState == 'active'

- name: Record existing legacy Swarm services
  ansible.builtin.set_fact:
    remove_legacy_swarm_services_existing: >-
      {{
        remove_legacy_swarm_services_inspections.results |
        default([]) | selectattr('rc', 'defined') |
        selectattr('rc', 'equalto', 0) |
        map(attribute='item') | list
      }}

- name: Quiesce legacy Swarm services
  ansible.builtin.command:
    argv:
      - docker
      - service
      - scale
      - "{{ item }}=0"
  loop: "{{ remove_legacy_swarm_services_existing }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when:
    - remove_legacy_swarm_services_action | default('remove') == 'quiesce'
    - not ansible_check_mode

- name: Remove legacy Swarm published ports during cutover
  ansible.builtin.command:
    argv:
      - docker
      - service
      - update
      - --publish-rm
      - "{{ item.1.target }}"
      - "{{ item.0 }}"
  loop: >-
    {{ remove_legacy_swarm_services_existing |
       product(remove_legacy_swarm_services_publish_ports | default([])) | list }}
  loop_control:
    label: "{{ item.0 }} port {{ item.1.target }}"
  changed_when: true
  when:
    - remove_legacy_swarm_services_action | default('remove') == 'quiesce'
    - not ansible_check_mode

- name: Wait for legacy Swarm services to stop
  ansible.builtin.command:
    argv:
      - docker
      - service
      - ps
      - --quiet
      - --filter
      - desired-state=running
      - "{{ item }}"
  loop: "{{ remove_legacy_swarm_services_existing }}"
  loop_control:
    label: "{{ item }}"
  register: remove_legacy_swarm_services_running_tasks
  changed_when: false
  retries: 30
  delay: 2
  until: remove_legacy_swarm_services_running_tasks.stdout | trim == ''
  when:
    - remove_legacy_swarm_services_action | default('remove') == 'quiesce'
    - not ansible_check_mode

- name: Restore legacy Swarm published ports
  ansible.builtin.command:
    argv:
      - docker
      - service
      - update
      - --publish-add
      - >-
        published={{ item.1.published }},target={{ item.1.target }},mode=ingress
      - "{{ item.0 }}"
  loop: >-
    {{ remove_legacy_swarm_services_existing |
       product(remove_legacy_swarm_services_publish_ports | default([])) | list }}
  loop_control:
    label: "{{ item.0 }} port {{ item.1.published }}"
  changed_when: true
  when:
    - remove_legacy_swarm_services_action | default('remove') == 'restore'
    - not ansible_check_mode

- name: Restore legacy Swarm services
  ansible.builtin.command:
    argv:
      - docker
      - service
      - scale
      - "{{ item }}=1"
  loop: "{{ remove_legacy_swarm_services_existing }}"
  loop_control:
    label: "{{ item }}"
  changed_when: true
  when:
    - remove_legacy_swarm_services_action | default('remove') == 'restore'
    - not ansible_check_mode

- name: Retire legacy Docker Swarm services
  community.docker.docker_swarm_service:
    name: "{{ item }}"
    state: absent
  loop: "{{ remove_legacy_swarm_services_existing }}"
  loop_control:
    label: "{{ item }}"
  when:
    - remove_legacy_swarm_services_action | default('remove') == 'remove'
    - not (remove_legacy_swarm_services_check_only | default(false) | bool)
