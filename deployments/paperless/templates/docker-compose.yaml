---
# Traefik label keys and Jinja expressions are intentionally kept intact.
# yamllint disable rule:line-length
name: paperless

services:
  paperless-broker:
    container_name: paperless-redis
    image: "docker.io/library/redis:{{ paperless.versions.broker }}"
    restart: unless-stopped
    volumes:
      - "{{ paperless.data_dir }}/broker:/data"
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping

  paperless-database:
    container_name: paperless-postgres
    image: "docker.io/library/postgres:{{ paperless.versions.database }}"
    restart: unless-stopped
    volumes:
      - "{{ paperless.database.data_dir }}:/var/lib/postgresql"
    secrets:
      - paperless_database_password
    environment:
      POSTGRES_DB: "{{ paperless.database.name }}"
      POSTGRES_USER: "{{ paperless.database.user }}"
      POSTGRES_PASSWORD_FILE: /run/secrets/paperless_database_password
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10

  paperless:
    container_name: paperless
    image: >-
      ghcr.io/paperless-ngx/paperless-ngx:{{ paperless.versions.app }}
    restart: unless-stopped
    networks:
      - default
      - proxy
    volumes:
      - "{{ paperless.data_dir }}/data:/usr/src/paperless/data"
      - "{{ paperless.data_dir }}/media:/usr/src/paperless/media"
      - "{{ paperless.data_dir }}/export:/usr/src/paperless/export"
      - "{{ paperless.data_dir }}/consume:/usr/src/paperless/consume"
    secrets:
      - paperless_secret_key
      - paperless_database_password
    environment:
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_secret_key
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: paperless-database
      PAPERLESS_DBPORT: '5432'
      PAPERLESS_DBNAME: "{{ paperless.database.name }}"
      PAPERLESS_DBUSER: "{{ paperless.database.user }}"
      PAPERLESS_DBPASS_FILE: /run/secrets/paperless_database_password
      PAPERLESS_URL: "https://paperless.{{ vault.shared.general.domain }}"
      PAPERLESS_ALLOWED_HOSTS: >-
        paperless.{{ vault.shared.general.domain }},{{ vault.shared.general.domain }},.{{ vault.shared.general.domain }}
      PAPERLESS_TIKA_ENABLED: '1'
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://paperless-gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://paperless-tika:9998
      PAPERLESS_OCR_MODE: auto
      PAPERLESS_ARCHIVE_FILE_GENERATION: always
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: 'true'
      USERMAP_UID: "{{ paperless.uid }}"
      USERMAP_GID: "{{ paperless.gid }}"
    depends_on:
      paperless-broker:
        condition: service_healthy
      paperless-database:
        condition: service_healthy
      paperless-gotenberg:
        condition: service_started
      paperless-tika:
        condition: service_started
    labels:
      traefik.enable: 'true'
      traefik.http.routers.paperless.entrypoints: web
      traefik.http.routers.paperless.rule: >-
        Host(`paperless.{{ vault.shared.general.domain }}`)
      traefik.http.middlewares.paperless-https-redirect.redirectscheme.scheme: >-
        https
      traefik.http.routers.paperless.middlewares: paperless-https-redirect
      traefik.http.routers.paperless-secure.entrypoints: websecure
      traefik.http.routers.paperless-secure.rule: >-
        Host(`paperless.{{ vault.shared.general.domain }}`)
      traefik.http.routers.paperless-secure.tls: 'true'
      traefik.http.routers.paperless-secure.service: paperless
      traefik.http.routers.paperless-secure.tls.certresolver: letsencrypt
      traefik.http.services.paperless.loadbalancer.server.port: '8000'
      traefik.docker.network: "{{ paperless.proxy_network }}"

  paperless-gotenberg:
    container_name: paperless-gotenberg
    image: >-
      docker.io/gotenberg/gotenberg:{{ paperless.versions.gotenberg }}
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-javascript=true
      - --chromium-allow-list=file:///tmp/.*

  paperless-tika:
    container_name: paperless-tika
    image: "docker.io/apache/tika:{{ paperless.versions.tika }}"
    restart: unless-stopped

networks:
  default:
    name: paperless_compose
  proxy:
    external: true
    name: "{{ paperless.proxy_network }}"

secrets:
  paperless_secret_key:
    file: ./secrets/paperless_secret_key
  paperless_database_password:
    file: ./secrets/paperless_database_password
