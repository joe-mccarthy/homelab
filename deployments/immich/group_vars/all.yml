---
immich:
  # Single-host paths and Docker network
  data_dir: /exports/docker/immich
  compose_dir: /opt/immich
  proxy_network: proxy
  allow_fresh_install: "{{ immich_allow_fresh_install | default(false) }}"

  # Database credentials (from Ansible Vault)
  database:
    name: immich
    user: "{{ vault.services.immich.database.user }}"
    password: "{{ vault.services.immich.database.password }}"

  # Pinned image tags for reproducible deployments
  versions:
    server: "v3.1.0"
    machine_learning: "v3.1.0"
    redis: >-
      9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    database: >-
      14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23

# Notes:
# - The play targets the host passed with -e target=<host-or-address>.
# - data_dir is local to that host; it does not need to be an NFS mount.
# - Define and encrypt both database values in Ansible Vault.
