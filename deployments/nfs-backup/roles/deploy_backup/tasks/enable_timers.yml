---
- name: Recheck repository locks before scheduler activation
  ansible.builtin.command:
    cmd: /usr/local/sbin/nfs-backup-job restic list locks
  register: deploy_backup_activation_repository_locks
  changed_when: false
  environment:
    NFS_BACKUP_MAINTENANCE: "1"

- name: Refuse scheduler activation during a repository operation
  ansible.builtin.assert:
    that:
      - >-
        deploy_backup_activation_repository_locks.stdout |
        regex_findall('(?m)^[0-9a-f]{64}$') | length == 0
    fail_msg: >-
      The Restic repository became locked during deployment; the previous
      timer state will be restored.

- name: Enable scheduled backup timers
  ansible.builtin.systemd:
    name: "nfs-backup-{{ item.item.key }}.timer"
    enabled: true
    state: "{{ item.changed | ternary('restarted', 'started') }}"
  loop: "{{ deploy_backup_timer_units.results }}"
  loop_control:
    label: "{{ item.item.key }}"

- name: Record backup scheduler activation
  ansible.builtin.set_fact:
    deploy_backup_scheduler_activated: true
