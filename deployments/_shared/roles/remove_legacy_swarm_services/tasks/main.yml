---
- name: Inspect Docker Swarm state
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - json
  register: remove_legacy_swarm_services_docker_info
  changed_when: false

- name: Require a Swarm manager for legacy service cleanup
  ansible.builtin.assert:
    that:
      - >-
        (remove_legacy_swarm_services_docker_info.stdout |
         from_json).Swarm.LocalNodeState != 'active'
        or (remove_legacy_swarm_services_docker_info.stdout |
            from_json).Swarm.ControlAvailable
    fail_msg: >-
      Legacy Swarm services can only be inspected and removed on a manager.
      Run this migration against a Swarm manager.

- name: Remove legacy Docker Swarm services
  community.docker.docker_swarm_service:
    name: "{{ item }}"
    state: absent
  loop: "{{ remove_legacy_swarm_services_list }}"
  loop_control:
    label: "{{ item }}"
  when: >-
    (remove_legacy_swarm_services_docker_info.stdout |
     from_json).Swarm.LocalNodeState == 'active'
    and not (remove_legacy_swarm_services_check_only | default(false) | bool)
