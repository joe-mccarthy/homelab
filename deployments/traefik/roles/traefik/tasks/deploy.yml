---
- name: Cut over Traefik to Docker Compose
  block:
    - name: Quiesce the legacy Traefik Swarm service
      ansible.builtin.include_role:
        name: remove_legacy_swarm_services
      vars:
        remove_legacy_swarm_services_action: quiesce
        remove_legacy_swarm_services_list:
          - traefik_traefik
        remove_legacy_swarm_services_publish_ports:
          - published: "{{ traefik.ports.web }}"
            target: 80
          - published: "{{ traefik.ports.websecure }}"
            target: 443
          - published: "{{ traefik.ports.ssh }}"
            target: 2222

    - name: Remove existing Traefik container before deployment
      community.docker.docker_container:
        name: traefik
        state: absent
        keep_volumes: true
        stop_timeout: 60

    - name: Create and start Traefik container
      community.docker.docker_compose_v2:
        project_src: "{{ traefik.compose_dir }}"
        project_name: traefik
        state: present
        pull: never
        recreate: always
        remove_orphans: true
        wait: true
        wait_timeout: 120
      register: traefik_compose

    - name: Verify Traefik is running
      ansible.builtin.assert:
        that:
          - "'traefik' in traefik_compose.containers | map(attribute='Service')"
          - >-
            (traefik_compose.containers
             | rejectattr('State', 'equalto', 'running') | list | length) == 0
        fail_msg: Docker Compose did not leave the Traefik service running
      when: not ansible_check_mode

  rescue:
    - name: Stop the failed Traefik Compose replacement
      community.docker.docker_compose_v2:
        project_src: "{{ traefik.compose_dir }}"
        project_name: traefik
        state: absent
        remove_orphans: true
      failed_when: false

    - name: Restore the legacy Traefik Swarm service
      ansible.builtin.include_role:
        name: remove_legacy_swarm_services
      vars:
        remove_legacy_swarm_services_action: restore
        remove_legacy_swarm_services_list:
          - traefik_traefik
        remove_legacy_swarm_services_publish_ports:
          - published: "{{ traefik.ports.web }}"
            target: 80
          - published: "{{ traefik.ports.websecure }}"
            target: 443
          - published: "{{ traefik.ports.ssh }}"
            target: 2222

    - name: Report failed Traefik cutover
      ansible.builtin.fail:
        msg: Traefik Compose deployment failed; the legacy service was restored.

- name: Retire the legacy Traefik Swarm service
  ansible.builtin.include_role:
    name: remove_legacy_swarm_services
  vars:
    remove_legacy_swarm_services_action: remove
    remove_legacy_swarm_services_list:
      - traefik_traefik
