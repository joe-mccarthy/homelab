---
# Traefik label keys and Jinja expressions are intentionally kept intact.
# yamllint disable rule:line-length
name: immich

services:
  immich-server:
    container_name: immich_server
    image: "ghcr.io/immich-app/immich-server:{{ immich.versions.server }}"
    restart: unless-stopped
    networks:
      - default
      - proxy
    volumes:
      - "{{ immich.data_dir }}/upload:/data"
      - "{{ immich.data_dir }}/backups:/data/backups"
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - db_username
      - db_password
    environment:
      DB_USERNAME_FILE: /run/secrets/db_username
      DB_PASSWORD_FILE: /run/secrets/db_password
      DB_DATABASE_NAME: "{{ immich.database.name }}"
      DB_HOSTNAME: immich-database
      REDIS_HOSTNAME: immich-redis
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-database:
        condition: service_healthy
    healthcheck:
      disable: false
    labels:
      traefik.enable: 'true'
      traefik.http.routers.immich.entrypoints: web
      traefik.http.routers.immich.rule: >-
        Host(`immich.{{ vault.shared.general.domain }}`)
      traefik.http.middlewares.immich-https-redirect.redirectscheme.scheme: >-
        https
      traefik.http.routers.immich.middlewares: immich-https-redirect
      traefik.http.routers.immich-secure.entrypoints: websecure
      traefik.http.routers.immich-secure.rule: >-
        Host(`immich.{{ vault.shared.general.domain }}`)
      traefik.http.routers.immich-secure.tls: 'true'
      traefik.http.routers.immich-secure.service: immich
      traefik.http.routers.immich-secure.tls.certresolver: letsencrypt
      traefik.http.services.immich.loadbalancer.server.port: '2283'
      traefik.docker.network: "{{ immich.proxy_network }}"

  immich-machine-learning:
    container_name: immich_machine_learning
    image: >-
      ghcr.io/immich-app/immich-machine-learning:{{ immich.versions.machine_learning }}
    restart: unless-stopped
    volumes:
      - "{{ immich.data_dir }}/ml:/cache"
    healthcheck:
      disable: false

  immich-redis:
    container_name: immich_redis
    image: "docker.io/valkey/valkey:{{ immich.versions.redis }}"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli ping || exit 1

  immich-database:
    container_name: immich_postgres
    image: "ghcr.io/immich-app/postgres:{{ immich.versions.database }}"
    restart: unless-stopped
    secrets:
      - db_username
      - db_password
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_username
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: "{{ immich.database.name }}"
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - "{{ immich.data_dir }}/database:/var/lib/postgresql/data"
    shm_size: 128mb
    healthcheck:
      disable: false

networks:
  default:
    name: immich_compose
  proxy:
    external: true
    name: "{{ immich.proxy_network }}"

secrets:
  db_username:
    file: ./secrets/db_username
  db_password:
    file: ./secrets/db_password
