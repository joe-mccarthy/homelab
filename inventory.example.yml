---
# Example Ansible inventory for standalone home lab hosts.
#
# Copy this file and populate it with your actual hostnames/IPs.
# Sensitive values (passwords, tokens, etc.) belong in an Ansible Vault file —
# see vault.template.yml for the full list of expected vault variables.
#
# Usage:
#   ansible-playbook -i inventory.yml home_server/setup.yml -e target=odin \
#     --extra-vars @vault.yml --ask-vault-pass --ask-become-pass

all:
  children:

    # -------------------------------------------------------------------------
    # nfs_servers: the single host used by the core deployment and NFS Backup
    # playbooks. Application data lives locally under /exports/docker.
    # Individual Compose deployments select their host with -e target=...
    # -------------------------------------------------------------------------
    nfs_servers:
      hosts:
        odin:
          ansible_host: 192.168.1.11
          ansible_user: pi

    # -------------------------------------------------------------------------
    # cluster: all hosts managed by the maintenance playbooks, including the
    # application host above and any additional standalone machines.
    # -------------------------------------------------------------------------
    cluster:
      children:
        nfs_servers: {}
      hosts:
        thor:
          ansible_host: 192.168.1.12
          ansible_user: pi

        loki:
          ansible_host: 192.168.1.13
          ansible_user: pi

        freyr:
          ansible_host: 192.168.1.21
          ansible_user: pi

        tyr:
          ansible_host: 192.168.1.22
          ansible_user: pi

        heimdall:
          ansible_host: 192.168.1.23
          ansible_user: pi

        baldur:
          ansible_host: 192.168.1.24
          ansible_user: pi

        frigg:
          ansible_host: 192.168.1.25
          ansible_user: pi

        skadi:
          ansible_host: 192.168.1.26
          ansible_user: pi

  # ---------------------------------------------------------------------------
  # Variables applied to every host in the inventory.
  # ---------------------------------------------------------------------------
  vars:
    ansible_python_interpreter: /usr/bin/python3
