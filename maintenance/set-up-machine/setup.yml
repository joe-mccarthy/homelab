---
# Configure baseline tooling and access for homelab hosts.
# The play handles SSH access, package updates, optional reboot handling,
# core utility installation, and a final systemd reload.

- name: Set up machine
  hosts: all  # Apply to all inventory hosts.
  become: true  # Most operations require elevated privileges.
  vars:
    user_keys: "{{ lookup('env', 'USER') }}"  # Local username used as the target account on managed hosts.

  tasks:
    # Configure SSH key-based authentication.
    - name: "Setting authorized key for user {{ user_keys }}"
      ansible.posix.authorized_key:
        user: "{{ user_keys }}"  # Account that will receive the key.
        state: present  # Ensure the key is present in authorized_keys.
        key: "{{ lookup('file', lookup('env', 'HOME') + public_key) }}"  # Read local public key file.
      # `public_key` should be defined in vars/group_vars/extra vars.

    # Update Debian-family hosts.
    - name: Update system packages
      when: ansible_facts['os_family'] == 'Debian'
      ansible.builtin.apt:
        upgrade: dist  # Equivalent to `apt dist-upgrade`.
        update_cache: true  # Refresh package index before upgrade.

    # Detect whether the host needs a reboot after upgrades.
    - name: Check if system requires reboot
      when: ansible_facts['os_family'] == 'Debian'
      ansible.builtin.stat:
        path: /var/run/reboot-required  # Created by apt when restart is required.
      register: ubuntu_reboot_required  # Used by the conditional reboot task below.

    # Reboot only when required.
    - name: Reboot system if required
      when: ubuntu_reboot_required.stat.exists | default(false)
      ansible.builtin.reboot:
        reboot_timeout: 600  # Wait up to 10 minutes for host to return.

    # Install baseline administration and troubleshooting tools.
    - name: Install core packages
      ansible.builtin.apt:
        name: "{{ item }}"  # Install from curated package list.
        state: present
      loop:
        - htop
        - curl
        - wget
        - git
        - unzip
        - zip
        - lm-sensors
        - net-tools
        - dnsutils
        - nfs-common
      # Includes monitoring, network diagnostics, and NFS client support.

    # Ensure Python dependencies for Ansible's Docker modules are installed.
    - name: Ensure Python dependencies are installed
      ansible.builtin.package:
        name: "{{ item }}"
        state: present
      loop:
        - python3-docker    # Docker SDK for Python used by Docker-focused automation.
        - python3-requests  # HTTP client library for API-driven scripts and modules.
        - python3-yaml      # YAML parser/emitter for config processing in Python utilities.
      # Baseline Python packages for current and future automation tasks.

    # Refresh systemd after package and service changes.
    - name: Reload systemd configuration
      ansible.builtin.systemd:
        daemon_reload: true  # Reload unit files from disk.
